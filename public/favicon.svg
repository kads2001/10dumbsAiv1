  <!-- Dark glassmorphic background container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2" />

  <!-- Brand Typography "10" with geometric precision -->
  <!-- "1" -->
  <path d="M 18 16 L 24 16 L 24 40 L 18 40 Z M 15 22 L 20 16 L 24 16 L 19 22 Z" fill="#ffffff" />
  <!-- "0" -->
  <path d="M 33 16 C 30 16 28 19 28 28 C 28 37 30 40 33 40 C 36 40 46 40 46 40 C 49 40 51 37 51 28 C 51 19 49 16 46 16 Z M 35 22 L 44 22 C 45 22 45.5 24 45.5 28 C 45.5 32 45 34 44 34 L 35 34 C 34 34 33.5 32 33.5 28 C 33.5 24 34 22 35 22 Z" fill="url(#blueGrad)" />

  <!-- Distinctive Brand Peaks (10 Dumbs signature Red & Blue M accent) -->
  <path d="M 23 48 L 28 42 L 33 48" fill="none" stroke="url(#redGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 31 48 L 36 42 L 41 48" fill="none" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
